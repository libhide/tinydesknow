<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Discover random NPR Tiny Desk concerts - get redirected to a surprise performance from the legendary series"
        />
        <meta
            name="keywords"
            content="NPR, Tiny Desk, concerts, music, random, discovery"
        />
        <meta name="author" content="Tiny Desk Now" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://tinydesknow.com" />
        <meta
            property="og:title"
            content="Tiny Desk Now - Random NPR Tiny Desk Concert"
        />
        <meta
            property="og:description"
            content="Discover random NPR Tiny Desk concerts - get redirected to a surprise performance from the legendary series"
        />
        <meta
            property="og:image"
            content="https://tinydesknow.com/og-image.jpg"
        />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://tinydesknow.com" />
        <meta
            property="twitter:title"
            content="Tiny Desk Now - Random NPR Tiny Desk Concert"
        />
        <meta
            property="twitter:description"
            content="Discover random NPR Tiny Desk concerts - get redirected to a surprise performance from the legendary series"
        />
        <meta
            property="twitter:image"
            content="https://tinydesknow.com/og-image.jpg"
        />

        <title>Tiny Desk Now - Random NPR Tiny Desk Concert</title>

        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                margin: 0;
                padding: 0;
                min-height: 100vh;
                background: #000000;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 2rem;
                position: relative;
            }

            .content {
                display: flex;
                align-items: center;
                gap: 4rem;
                max-width: 1200px;
                width: 100%;
            }

            .mic-image {
                flex-shrink: 0;
                max-width: 400px;
                width: 100%;
            }

            .mic-image img {
                width: 100%;
                height: auto;
                filter: invert(1);
            }

            .text-content {
                flex: 1;
                text-align: left;
            }

            .main-text {
                font-size: 4rem;
                font-weight: 400;
                line-height: 1.2;
                margin: 0 0 2rem 0;
                letter-spacing: -0.02em;
            }

            .credit {
                font-size: 1.2rem;
                opacity: 0.7;
                margin: 0;
            }

            .credit a {
                color: white;
                text-decoration: underline;
            }

            /* Mobile styles */
            @media (max-width: 768px) {
                .content {
                    flex-direction: column;
                    gap: 2rem;
                    text-align: center;
                }

                .mic-image {
                    max-width: 200px;
                    order: -1;
                }

                .text-content {
                    text-align: center;
                }

                .main-text {
                    font-size: 2.5rem;
                }

                .credit {
                    font-size: 1rem;
                }
            }

            @media (max-width: 480px) {
                .main-text {
                    font-size: 2rem;
                }
                
                .container {
                    padding: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="content">
                <div class="mic-image">
                    <img src="img/mic.jpg" alt="Microphone" />
                </div>
                <div class="text-content">
                    <h1 class="main-text">finding you a tiny concert...</h1>
                    <p class="credit">made with &lt;3 by <a href="https://ratik.me">ratik</a></p>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
