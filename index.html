<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Jam to a random Tiny Desk concert." />
        <meta
            name="keywords"
            content="NPR, Tiny Desk, concerts, music, random, discovery"
        />
        <meta name="author" content="Ratik" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://tinydesk.now" />
        <meta property="og:title" content="Tiny Desk Now" />
        <meta
            property="og:description"
            content="Jam to a random Tiny Desk concert."
        />
        <meta property="og:image" content="https://tinydesk.now/img/og.jpg" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://tinydesk.now" />
        <meta property="twitter:title" content="Tiny Desk Now" />
        <meta
            property="twitter:description"
            content="Jam to a random Tiny Desk concert."
        />
        <meta
            property="twitter:image"
            content="https://tinydesk.now/img/og.jpg"
        />

        <title>Tiny Desk Now</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">

        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                margin: 0;
                padding: 0;
                height: 100vh;
                background: #000000;
                color: white;
                overflow: hidden;
            }

            .mic-image {
                width: 50%;
                position: absolute;
                bottom: 0;
                left: 0;
                z-index: -99;
            }

            .mic-image img {
                width: 100%;
                height: auto;
                display: block;
            }

            .text-content {
                z-index: 99;
            }

            .title {
                position: absolute;
                bottom: 22rem;
                right: 15rem;
            }

            .title {
                font-size: 5rem;
                font-weight: 400;
                line-height: 1.2;
                margin: 0 0 2rem 0;
                letter-spacing: -0.02em;
            }

            .credit {
                font-size: 2.5rem;
                position: absolute;
                bottom: 16rem;
                right: 10rem;
            }

            .credit a {
                color: white;
                text-decoration: underline;
            }

            /* Mobile styles */
            @media (max-width: 1476px) {
                .mic-image {
                    width: 100%;
                }

                .text-content {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    margin-top: 5rem;
                }

                .title {
                    display: block;
                    position: static;
                    font-size: 3rem;
                    text-align: center;
                    width: auto;
                }

                .credit {
                    position: static;
                    display: block;
                    font-size: 1.5rem;
                    text-align: center;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="text-content">
                <h1 class="title">finding you a tiny concert...</h1>
                <p class="credit">
                    made with &lt;3 by
                    <a href="https://ratik.in" target="_blank">ratik</a>
                </p>
            </div>
            <div class="mic-image">
                <img src="/img/mic.jpg" alt="Microphone" />
            </div>
        </div>
        <script src="/script.js"></script>
    </body>
</html>
